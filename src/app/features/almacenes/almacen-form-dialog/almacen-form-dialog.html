<h2 mat-dialog-title>{{ esEdicion ? 'Editar almacén' : 'Nuevo almacén' }}</h2>

<mat-dialog-content>
  @if (error()) {
    <div class="mensaje-error">
      <mat-icon>error_outline</mat-icon>
      <span>{{ error() }}</span>
    </div>
  }

  <form [formGroup]="form" class="formulario">
    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Código</mat-label>
      <input matInput formControlName="codigo" placeholder="Ej: ALM-01" [readonly]="esEdicion">
      @if (form.get('codigo')?.hasError('required')) {
        <mat-error>El código es obligatorio</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" placeholder="Ej: Almacén Central">
      @if (form.get('nombre')?.hasError('required')) {
        <mat-error>El nombre es obligatorio</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Dirección</mat-label>
      <textarea matInput formControlName="direccion" rows="2" placeholder="Ej: Planta principal - Av. Industrial 450"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cerrar()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="guardar()" [disabled]="cargando() || form.invalid">
    @if (cargando()) {
      <mat-spinner diameter="20"></mat-spinner>
    } @else {
      {{ esEdicion ? 'Guardar cambios' : 'Crear almacén' }}
    }
  </button>
</mat-dialog-actions>
